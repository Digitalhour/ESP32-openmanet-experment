[platformio]
default_envs = xiao_esp32s3
; PlatformIO defaults to expecting sources in src_dir/ separate from the
; project root; this is a native ESP-IDF layout (root CMakeLists.txt +
; main/ as the ESP-IDF "main" component), so src_dir must point at main/
; itself. Pointing it at "." instead makes PlatformIO pass the project
; root as EXTRA_COMPONENT_DIRS (espidf.py L1751-1753), and since the root
; CMakeLists.txt satisfies ESP-IDF's "does this dir have a CMakeLists.txt"
; component check (tools/cmake/project.cmake L433), ESP-IDF re-registers
; the whole project as a component of itself - which re-runs project()
; recursively inside the cmake -P script-mode subprocess ESP-IDF uses for
; early component-requirement expansion (tools/cmake/component.cmake
; L206-224), and CMake's ExternalProject module calls define_property()
; during kconfig.cmake's `include(ExternalProject)`, which is not allowed
; in script mode - producing "define_property command is not scriptable".
src_dir = main

[env:xiao_esp32s3]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = espidf

; Keep ESP-IDF as the source of truth for project configuration.
board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.partitions = partitions.csv

monitor_speed = 115200

; See pio_embed_generated_binaries.py for why this is needed (PlatformIO's
; espidf integration doesn't run CMake's own build graph, so the
; generated-file embed steps in main/CMakeLists.txt and the vendored
; morsemicro__halow firmware component never execute under `pio run`
; without it).
extra_scripts = pre:pio_embed_generated_binaries.py